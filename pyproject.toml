[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geores"
version = "0.1.0"
description = "GeoRes - Satellite Image Super-Resolution and Enhancement Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "GeoRes Team" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0"
]

[project.optional-dependencies]
data = ["kaggle>=1.6.0"]
test = ["pytest>=8.0.0"]

[project.scripts]
geores-train = "src.train:main"
geores-eval = "src.evaluate:main"
geores-predict = "src.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "frontend", "static"]
